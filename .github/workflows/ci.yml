name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sentinel-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sentinel-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/sentinel-api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Benchmark smoke run (one seed)
        run: python -m benchmark --seeds 1 --systems alert_correlator sentinel_full > /dev/null
      - name: Container builds
        run: docker build -t sentinelops-api .

  shop-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/shop-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/shop-web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
